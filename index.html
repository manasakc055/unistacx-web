<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>UIstacx | Revamping Our Website</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f8f9fa;
    }
    .revamp-container {
      text-align: center;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    .revamp-logo {
      width: 150px;
      margin-bottom: 20px;
    }
    .revamp-title {
      font-size: 1.8rem;
      color: #333;
      margin-bottom: 15px;
    }
    .revamp-text {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 30px;
    }
    .btn-primary {
      background-color: #0069d9;
      border: none;
      padding: 10px 20px;
    }
    .btn-primary:hover {
      background-color: #004085;
    }
  </style>
</head>
<body>

  <div class="revamp-container">
    <!-- Logo -->
    <img src="logo1.svg" class="revamp-logo">
    
    <!-- Title -->
    <h1 class="revamp-title">We're Revamping Our Website</h1>

    <!-- Message -->
    <p class="revamp-text">Exciting changes are coming soon! We are working hard to provide you with an even better experience. Stay tuned for our new and improved website.</p>

   <!-- Contact Information -->
   <p class="contact-info">Contact us for your queries: <a href="mailto:hello@unistacx.com">hello@unistacx.com</a></p>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
